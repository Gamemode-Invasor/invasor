name: Release

# Pushing a tag such as v0.1.0 builds, tests and packs Invasor, and publishes
# invasor-<version>.tar.gz with its .sha256 as a GitHub release. The release text is
# RELEASE_NOTES.md (a short plain-text summary, shown in the panel, then a line with only ---)
# followed by GitHub's generated notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must match the version in the code
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/invasor/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2; exit 1; }
      - name: The tag must be a release (vX.Y.Z) or a release candidate (vX.Y.Z-rcN)
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rcN" >&2; exit 1; }
      - name: RELEASE_NOTES.md must have a short summary, then a line with only ---
        run: |
          [ -s RELEASE_NOTES.md ] || { echo "RELEASE_NOTES.md is missing or empty" >&2; exit 1; }
          grep -qx -- '---' RELEASE_NOTES.md || { echo "RELEASE_NOTES.md has no line with only ---" >&2; exit 1; }
          [ "$(head -n 1 RELEASE_NOTES.md)" != "---" ] || { echo "RELEASE_NOTES.md has no summary before ---" >&2; exit 1; }
      - name: Build, test and pack
        run: python3 tools/pack_release.py --out dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Invasor ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --generate-notes "${pre[@]}"
