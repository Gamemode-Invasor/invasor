name: Release

# Pushing a tag such as v0.1.0 builds, tests and packs Invasor, and publishes
# invasor-<version>.tar.gz with its .sha256 as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must match the version in the code
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/invasor/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2; exit 1; }
      - name: Build, test and pack
        run: python3 tools/pack_release.py --out dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Invasor ${GITHUB_REF_NAME#v}" --generate-notes
